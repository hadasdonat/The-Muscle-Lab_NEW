# Render Blueprint: one API web service and one static site.
# The database is hosted separately (see docs/DEPLOYMENT.md); its settings are entered in the dashboard.
services:
  - type: web
    name: muscle-lab-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: TZ
        value: Asia/Jerusalem
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false

  - type: web
    name: muscle-lab-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
